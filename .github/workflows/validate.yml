name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the detection libraries (for rule cross-checks)
        run: |
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/open-yaral-detections.git
          git clone --depth 1 https://github.com/${{ github.repository_owner }}/sentinel-kql-detections.git

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate playbooks, links and linked rules; regenerate index
        run: |
          python tools/check_playbooks.py playbooks \
            --index playbooks/INDEX.md \
            --rules-dir open-yaral-detections/rules \
            --kql-dir sentinel-kql-detections/detections
          git diff --exit-code -- playbooks/INDEX.md playbooks/RULE-MAP.md || { echo "::error::playbooks/INDEX.md or RULE-MAP.md is stale - run tools/check_playbooks.py and commit"; exit 1; }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Compile every playbook KQL query with Microsoft's Sentinel analyzer
        run: |
          bash tools/kql-validator/fetch-schemas.sh
          python tools/export_kql.py playbooks .kql-snippets
          dotnet run --project tools/kql-validator -c Release -- .kql-snippets .schemas/azure-sentinel/.script/tests/KqlvalidationsTests

      - name: Build the SOC IR Field Guide (fails if any decision tree does not render)
        run: |
          python tools/build_field_guide.py --out field-guide/index.html --pdf field-guide/SOC-IR-Field-Guide.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: soc-ir-field-guide
          path: field-guide/SOC-IR-Field-Guide.pdf

      - name: Package the online field guide
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: field-guide

  pages:
    name: Publish online field guide
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
